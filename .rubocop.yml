# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-performance
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-factory_bot
  - rubocop-rake
  - rubocop-sorbet

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

AllCops:
  NewCops: enable
  Exclude:
    - "sorbet/rbi/**/*"

Layout/HashAlignment:
  EnforcedColonStyle: table

RSpecRails/InferredSpecType:
  Enabled: false

Sorbet/TrueSigil:
  Enabled: true
  Include:
    - "app/services/rebilling/attempt.rb"
    - "app/services/rebilling/context.rb"
    - "app/services/rebilling/decision.rb"
    - "app/services/rebilling/failure_classification.rb"
    - "app/services/rebilling/plan.rb"
    - "app/services/rebilling/payment_method_snapshot.rb"
    - "app/services/rebilling/retry_step.rb"

Sorbet/StrictSigil:
  Enabled: true
  Include:
    - "app/services/rebilling/decision_outcome.rb"
    - "app/services/rebilling/failure_classifier.rb"
    - "app/services/rebilling/failure_classifier_contract.rb"
    - "app/services/rebilling/payment_method_policy.rb"

Sorbet/FalseSigil:
  Exclude:
    # Dry.Types creates the ancestor dynamically; Sorbet cannot resolve it.
    - "lib/dry_type_catalog.rb"

Sorbet/ConstantsFromStrings:
  Exclude:
    # Reflection is the purpose of this runtime catalog compiler.
    - "sorbet/tapioca/compilers/dry_type_namespaces.rb"
    - "lib/dry_type_catalog.rb"

Sorbet/BlockMethodDefinition:
  Exclude:
    # RSpec helper methods and fixture classes are defined in example groups.
    - "spec/**/*"
    - "test/tooling/**/*"

version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  groups:
    sorbet-toolchain:
      patterns:
      - "sorbet*"
      - "tapioca"
      - "spoom"
      - "rbi"
      - "rubydex"
      update-types: [minor, patch]
    dry-rb:
      patterns: ["dry-*"]
      update-types: [minor, patch]
    minor-and-patch:
      update-types: [minor, patch]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  groups:
    github-actions:
      patterns: ["*"]

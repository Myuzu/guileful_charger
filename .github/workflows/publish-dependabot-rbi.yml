name: Publish Dependabot RBIs

# This workflow and its Ruby helper come from the default branch. Never check
# out PR code or install its dependencies in this privileged workflow.
on:
  workflow_run:
    workflows: [Dependabot RBI generation]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: publish-rbi-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted publishing code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Ruby without installing repository gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: false

      - name: Download the originating run's artifact outside the workspace
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependabot-rbi-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/rbi-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate provenance, paths, and current PR head
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ runner.temp }}/rbi-artifact/dependabot-rbi.json
          PLAN: ${{ runner.temp }}/rbi-plan.json
        run: ruby script/dependabot_rbi.rb prepare "$ARTIFACT" "$PLAN"

      - name: Require dedicated App configuration
        if: steps.candidate.outputs.changed == 'true'
        env:
          CLIENT_ID: ${{ vars.RBI_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RBI_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$CLIENT_ID" || -z "$PRIVATE_KEY" ]]; then
            echo '::error::Configure RBI_APP_CLIENT_ID and RBI_APP_PRIVATE_KEY. See README Dependabot section; the generated artifact is available for manual use.'
            exit 1
          fi

      - name: Mint a repository-scoped publishing token
        if: steps.candidate.outputs.changed == 'true'
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RBI_APP_CLIENT_ID }}
          private-key: ${{ secrets.RBI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: Commit interfaces only if the PR head is unchanged
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PLAN: ${{ runner.temp }}/rbi-plan.json
        run: ruby script/dependabot_rbi.rb publish "$PLAN"

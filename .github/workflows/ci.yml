name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Test publisher with complete line coverage
        run: bundle exec ruby bin/test_tooling automation

  compiler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Test standalone compiler with complete line coverage
        run: bin/test_tooling compiler

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Check types and gem interfaces
        run: |
          bundle exec srb tc
          bin/tapioca gems --verify

  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432

    services:
      rabbitmq:
        image: rabbitmq:4.4.0-management
        env:
          RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
            -rabbitmq_management_agent disable_metrics_collector true
            -rabbitmq_management disable_stats true enable_queue_totals true
        options: >-
          --health-cmd "gosu rabbitmq rabbitmq-diagnostics -q check_running"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y curl libjemalloc2 libvips postgresql-client libpq-dev

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and start PostgreSQL with pg_partman and pg_cron
        run: bash script/ci_postgres.sh

      - name: Enable RabbitMQ plugins and check deprecated features
        env:
          RABBITMQ_CONTAINER: ${{ job.services.rabbitmq.id }}
        run: |
          docker exec --user rabbitmq "$RABBITMQ_CONTAINER" rabbitmq-plugins enable rabbitmq_prometheus rabbitmq_consistent_hash_exchange
          docker exec --user rabbitmq "$RABBITMQ_CONTAINER" rabbitmq-diagnostics -q check_alarms
          docker exec --user rabbitmq "$RABBITMQ_CONTAINER" rabbitmq-diagnostics -q check_if_any_deprecated_features_are_used

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare test database
        id: test_database
        run: bin/rails db:create db:migrate

      - name: Verify Rails interfaces
        run: CI=1 bin/tapioca dsl --verify

      - name: Run tests
        if: ${{ !cancelled() && steps.test_database.outcome == 'success' }}
        run: bin/rspec


name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Test publisher with complete line coverage
        run: |
          bundle exec ruby -rcoverage <<'RUBY'
          Coverage.start(lines: true)
          require "rspec/core"
          status = RSpec::Core::Runner.run(["spec/automation"])
          lines = Coverage.result.fetch(File.expand_path("script/dependabot_rbi.rb")).fetch(:lines)
          missed = lines.each_index.select { |index| lines[index] == 0 }.map { |index| index + 1 }
          abort "Uncovered publisher lines: #{missed.join(', ')}" unless missed.empty?
          puts "Publisher line coverage: 100%"
          exit status
          RUBY

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Check types and gem interfaces
        run: |
          bundle exec srb tc
          bin/tapioca gems --verify

  test:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:4.4.0-management
        env:
          RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
            -rabbitmq_management_agent disable_metrics_collector true
            -rabbitmq_management disable_stats true enable_queue_totals true
        options: >-
          --health-cmd "gosu rabbitmq rabbitmq-diagnostics -q check_running"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y curl libjemalloc2 libvips postgresql-client libpq-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and start PostgreSQL with pg_partman and pg_cron
        run: |
          docker build -f .devcontainer/postgres/Dockerfile -t guileful-postgres .
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=guileful_charger_development \
            -p 5432:5432 \
            guileful-postgres \
            postgres \
              -c shared_preload_libraries=pg_cron \
              -c cron.database_name=guileful_charger_development
          until pg_isready -h localhost -U postgres; do sleep 1; done

      - name: Enable RabbitMQ plugins and check deprecated features
        env:
          RABBITMQ_CONTAINER: ${{ job.services.rabbitmq.id }}
        run: |
          docker exec --user rabbitmq "$RABBITMQ_CONTAINER" rabbitmq-plugins enable rabbitmq_prometheus rabbitmq_consistent_hash_exchange
          docker exec --user rabbitmq "$RABBITMQ_CONTAINER" rabbitmq-diagnostics -q check_alarms
          docker exec --user rabbitmq "$RABBITMQ_CONTAINER" rabbitmq-diagnostics -q check_if_any_deprecated_features_are_used

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: |
          bin/rails db:create db:migrate
          bin/tapioca dsl --verify
          bin/rails spec


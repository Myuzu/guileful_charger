name: Dependabot RBI generation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - Gemfile
      - Gemfile.lock

permissions:
  contents: read

concurrency:
  group: dependabot-rbi-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'dependabot/bundler/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432

    steps:
      - name: Checkout the exact dependency update
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install PostgreSQL build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev postgresql-client

      - name: Start a disposable test database
        run: bash script/ci_postgres.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Generate and validate candidate interfaces
        run: |
          bin/rails db:create db:migrate
          # Full regeneration also covers Tapioca/Sorbet and cross-gem changes.
          bin/tapioca gems --all
          CI=1 bin/tapioca dsl
          bundle exec srb tc
          bin/rspec

      - name: Collect only generated interfaces
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ruby script/dependabot_rbi.rb collect tmp/dependabot-rbi.json

      - name: Upload candidate interfaces
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependabot-rbi-${{ github.event.pull_request.head.sha }}
          path: tmp/dependabot-rbi.json
          if-no-files-found: error
          retention-days: 3

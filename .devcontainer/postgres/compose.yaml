services:
  postgres:
    build:
      context: ../..
      dockerfile: .devcontainer/postgres/Dockerfile
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=guileful_charger_development
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: guileful_charger_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

volumes:
  postgres-data:
